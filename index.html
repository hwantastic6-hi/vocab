<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이니쌤 VOCA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D5BD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이니쌤 VOCA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>.foot{padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<style>
/* Layout: 한 줄 세로형 휴대폰 앱 · 상단 고정 바 · 카드는 단어 카드와 선택지에만 */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --ink:#13203A; --muted:#5A6A83; --line:#D9E1EC;
  --accent:#1D5BD6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC; --brand:#1D5BD6;
  --good:#16805A; --good-soft:#E0F3EA; --warn:#A86400; --warn-soft:#FAEFD9; --bad:#C2392F; --bad-soft:#FBE5E2;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-word:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1320; --surface:#141E31; --ink:#E5EBF5; --muted:#93A2BA; --line:#26324A;
  --accent:#6E9DFF; --accent-ink:#0C1320; --accent-soft:#1B2B4B; --brand:#7FA8FF;
  --good:#4CC896; --good-soft:#123528; --warn:#E6A84A; --warn-soft:#3A2A10; --bad:#F07A6F; --bad-soft:#3D1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1320; --surface:#141E31; --ink:#E5EBF5; --muted:#93A2BA; --line:#26324A;
  --accent:#6E9DFF; --accent-ink:#0C1320; --accent-soft:#1B2B4B; --brand:#7FA8FF;
  --good:#4CC896; --good-soft:#123528; --warn:#E6A84A; --warn-soft:#3A2A10; --bad:#F07A6F; --bad-soft:#3D1A17;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{font-family:var(--f-word);font-weight:600;color:var(--accent);margin-left:2px}
.by{color:var(--brand);font-weight:600;font-size:12px;letter-spacing:.03em}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who b{color:var(--ink);font-weight:600}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:500;font-size:13px}

.demo{background:var(--accent-soft);color:var(--ink);font-size:12.5px}
.demo .gut{padding-block:8px}
main.gut{padding-block:18px 32px;display:flex;flex-direction:column;gap:18px}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.foot .gut{padding-block:14px 22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* 타이포 */
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.back{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--muted);font-size:13.5px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px}
.big strong{font-size:17px}
.big span{font-size:12.5px;color:var(--muted)}
.big.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big.primary span{color:var(--accent-ink);opacity:.85}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}

/* 탭·목록 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-weight:700;font-size:16px}
.item .s{font-size:12.5px;color:var(--muted)}
.item>div{min-width:0}
.pill{flex:0 0 auto;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.wordrow{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--line)}
.wordrow:first-child{border-top:0}
.wordrow .en{font-family:var(--f-word);font-size:17px;font-weight:600;overflow-wrap:anywhere}
.wordrow .ko{font-size:13.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);align-self:center}
.dot.l1{background:var(--bad)} .dot.l2{background:var(--warn)} .dot.l3{background:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* 오답노트 진입 */
.notebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--bad-soft);border:0;text-align:left;width:100%}
.notebar b{color:var(--bad);font-size:15px}
.notebar span{font-size:12.5px;color:var(--muted)}

/* 단어 카드 */
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px 22px;min-height:290px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;width:100%}
.flash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hw{font-family:var(--f-word);font-size:clamp(32px,9.5vw,44px);font-weight:600;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.speak{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.speak svg{width:18px;height:18px;fill:var(--accent)}
.hint{margin-top:auto;font-size:13px;color:var(--muted)}
.back-side{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.ko-big{font-size:20px;font-weight:700}
.ex{font-family:var(--f-word);font-size:17px;font-style:italic;line-height:1.5;margin:0}
mark{background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:600;padding:0 3px;border-radius:4px}
.dl{display:flex;align-items:baseline;gap:8px;font-size:14.5px;flex-wrap:wrap}
.der{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.der b{font-family:var(--f-word);font-size:16px;font-weight:600;margin-right:4px}
.lab{flex:0 0 auto;font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:12px;padding:14px 6px;font-weight:700;min-height:52px}
.r1{background:var(--bad-soft);color:var(--bad)} .r2{background:var(--warn-soft);color:var(--warn)} .r3{background:var(--good-soft);color:var(--good)}

/* 테스트 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.qbox{display:flex;flex-direction:column;gap:12px;padding:6px 0 4px}
.qlabel{font-size:13.5px;font-weight:600;color:var(--muted)}
.qword{font-family:var(--f-word);font-size:clamp(30px,9vw,40px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.qko{font-size:24px;font-weight:700;line-height:1.35}
.qsent{font-family:var(--f-word);font-size:20px;line-height:1.55;margin:0}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-style:normal;font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:52px}
.choice .n{flex:0 0 auto;font-size:18px;color:var(--muted);width:20px;text-align:center}
.choice .c{min-width:0;overflow-wrap:anywhere}
.choice.en .c{font-family:var(--f-word);font-size:18px;font-weight:600}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .n{color:var(--good)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.bad .n{color:var(--bad)}
.choice:disabled{cursor:default;opacity:1}
.spellhint{font:500 18px var(--f-mono);letter-spacing:.18em;color:var(--muted)}
.inp.word{font-family:var(--f-word);font-size:22px;font-weight:600}
.inp.ok{border-color:var(--good);background:var(--good-soft)} .inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:500;color:var(--ink);margin-top:2px}
.fb .w{font-family:var(--f-word);font-size:17px}
.types{display:flex;flex-direction:column;gap:8px}
.type{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.type b{display:block;font-size:16px}
.type span{font-size:12.5px;color:var(--muted)}
.type:disabled{opacity:.45}

/* 결과 */
.score{display:flex;align-items:flex-end;gap:14px;padding:6px 0}
.score .v{font-family:var(--f-word);font-size:76px;font-weight:600;line-height:.9;font-variant-numeric:tabular-nums}
.score .of{font-size:15px;color:var(--muted);padding-bottom:6px}
.wrong{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:11px 16px;border-top:1px solid var(--line)}
.wrong:first-child{border-top:0}
.wrong .en{font-family:var(--f-word);font-size:17px;font-weight:600}
.wrong .my{grid-column:1/-1;font-size:12.5px;color:var(--bad)}
.sendstate{font-size:13px;color:var(--muted)}

/* 선생님 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.sel{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
.topw{display:grid;grid-template-columns:minmax(0,1fr) 3em 1.6em;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:14px}
.topw:first-child{border-top:0}
.topw .en{font-family:var(--f-word);font-size:16px;font-weight:600}
.topw .bar{height:6px;background:var(--bad-soft);border-radius:99px;overflow:hidden}
.topw .bar i{display:block;height:100%;background:var(--bad)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}
.install{margin:0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13.5px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.big2{grid-template-columns:1fr}.stats .v{font-size:19px}}
</style>

</head>
<body>
<header class="top"><div class="gut top-in">
  <div class="brand"><span class="logo">이니쌤 <i>VOCA</i></span><span class="by">♥BY 이니쌤♥</span></div>
  <div id="who" class="who"></div>
</div></header>
<div id="demo" class="demo" hidden><div class="gut">체험 모드예요. 이름 <b>체험학생</b> · PIN <b>0000</b>, 선생님 비밀번호 <b>1234</b>. 결과는 이 기기에만 저장돼요.</div></div>
<main id="app" class="gut"><p class="sub"><span class="spin"></span> 불러오는 중…</p></main>
<footer class="foot"><div class="gut"><span class="by">♥BY 이니쌤♥</span><span>담당반 단어 암기 · 테스트</span></div></footer>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<script>
(function(){
'use strict';
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var CFG = window.INIVOCA || {};
var APP_URL = /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(CFG.appUrl||'').trim()) ? String(CFG.appUrl).trim() : '';
var LIVE = IS_GAS || !!APP_URL;
var CAT_ORDER = ['단어장','부교재','교과서'];
var TYPES = [
  {id:'en2ko', name:'영 → 한', desc:'영어 단어를 보고 알맞은 뜻 고르기'},
  {id:'ko2en', name:'한 → 영', desc:'뜻을 보고 알맞은 영어 단어 고르기'},
  {id:'cloze', name:'예문 빈칸', desc:'예문 빈칸에 들어갈 단어 고르기 · 수능형'},
  {id:'spell', name:'철자 쓰기', desc:'뜻을 보고 철자 직접 쓰기 · 내신 서술형'},
  {id:'synant', name:'유의어·반의어', desc:'유의어나 반의어 고르기'},
  {id:'mix', name:'혼합', desc:'여러 유형을 섞어서 풀기'}
];
var TYPE_NAME = {}; TYPES.forEach(function(t){ TYPE_NAME[t.id] = t.name; });
var MARK = ['①','②','③','④','⑤'];
var SPEAK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var CAN_SPEAK = 'speechSynthesis' in window;

var S = {screen:'login', user:null, pin:'', sets:[], settings:{pass:90,count:20}, stats:{}, note:[], cat:null, set:null, study:null, quiz:null, result:null, teacher:null, tKey:'all', tPw:''};
var $app = document.getElementById('app');
var $who = document.getElementById('who');

/* ---------- 공통 도구 ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function store(k, v){ try{ if(arguments.length < 2) return JSON.parse(localStorage.getItem('inivoca.'+k)); localStorage.setItem('inivoca.'+k, JSON.stringify(v)); }catch(e){ return null; } }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function key(cat, unit){ return cat + '|' + unit; }
function pad(n){ return (n<10?'0':'') + n; }
function nowStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function shortDate(t){ return String(t||'').slice(5,16); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.hidden=true; }, 2200); }
function speak(text){ if(!CAN_SPEAK) return; try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9; speechSynthesis.speak(u); }catch(e){} }
function norm(s){ return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim(); }
function splitList(s){ return String(s||'').split(/[,;\/]/).map(function(x){ return x.trim(); }).filter(Boolean); }

/* 예문에서 표제어 찾기 (변화형 포함) */
function locate(ex, en){
  if(!ex || !en) return null;
  var w = en.toLowerCase().trim();

  var re = /[A-Za-z][A-Za-z'-]*/g, m;
  while((m = re.exec(ex))){ if(forms.indexOf(m[0].toLowerCase()) >= 0) return {i:m.index, len:m[0].length}; }

  re.lastIndex = 0;
  while((m = re.exec(ex))){ var t = m[0].toLowerCase(); if(t.indexOf(st) === 0 && t.length <= st.length + 4) return {i:m.index, len:m[0].length}; }

/* 성적·오답 계산 (구글 시트 코드와 같은 규칙) */
var Core = {
  isRetry: function(r){ return String(r.type||'').indexOf('재시험') === 0; },
  stats: function(results, name){
    var m = {};
    results.forEach(function(r){
      if(r.name !== name || r.cat === '오답노트') return;
      var k = key(r.cat, r.unit), s = m[k] || (m[k] = {best:0, last:0, tries:0, passed:false});
      s.tries++;
      if(!Core.isRetry(r)){ s.best = Math.max(s.best, r.score); s.last = r.score; if(r.pass) s.passed = true; }
    });
    return m;
  },
  note: function(results, name){
    var m = {};
    results.filter(function(r){ return r.name === name; }).forEach(function(r, i){
      (r.wrong||[]).forEach(function(en){ var k = en.toLowerCase(); var o = m[k] || (m[k] = {en:en, count:0, lw:-1, lr:-1, last:''}); o.count++; o.lw = i; o.last = r.t; });
      (r.right||[]).forEach(function(en){ var k = en.toLowerCase(); if(m[k]) m[k].lr = i; });
    });
    return Object.keys(m).map(function(k){ return m[k]; })
      .filter(function(o){ return o.lw > o.lr; })
      .sort(function(a,b){ return b.count - a.count || (b.last > a.last ? 1 : -1); })
      .map(function(o){ return {en:o.en, count:o.count, last:o.last}; });
  }
};

function allWords(){ var a=[]; S.sets.forEach(function(s){ s.words.forEach(function(w){ a.push(w); }); }); return a; }
function findWord(en){ var k=en.toLowerCase(); var all=allWords(); for(var i=0;i<all.length;i++){ if(all[i].en.toLowerCase()===k) return all[i]; } return null; }
function cats(){ var seen={}, out=[]; CAT_ORDER.concat(S.sets.map(function(s){ return s.cat; })).forEach(function(c){ if(!seen[c] && S.sets.some(function(s){ return s.cat===c; })){ seen[c]=1; out.push(c); } }); return out; }
function levels(){ return store('lv') || {}; }
function setLevel(en, lv){ var m=levels(); m[en.toLowerCase()]=lv; store('lv', m); }
function canType(w, t){
  if(t==='cloze') return !!locate(w.ex, w.en);
  if(t==='synant') return !!(w.syn || w.ant);
  return true;
}

/* ---------- 문제 만들기 ---------- */
function choicesFrom(correct, cands){
  var seen = {}; seen[norm(correct)] = 1;
  var picked = [];
  shuffle(cands).forEach(function(c){ var n = norm(c); if(c && !seen[n] && picked.length < 4){ seen[n] = 1; picked.push(c); } });
  return shuffle(picked.concat([correct]));
}
function makeQ(w, t, pool){
  var others = pool.filter(function(x){ return x.en.toLowerCase() !== w.en.toLowerCase(); });
  if(others.length < 4){ var extra = allWords().filter(function(x){ return x.en.toLowerCase() !== w.en.toLowerCase(); }); others = others.concat(shuffle(extra)); }
  if(t==='en2ko') return {t:t, w:w, answer:w.ko, ch:choicesFrom(w.ko, others.map(function(x){ return x.ko; })), en:false};
  if(t==='ko2en') return {t:t, w:w, answer:w.en, ch:choicesFrom(w.en, others.map(function(x){ return x.en; })), en:true};
  if(t==='cloze') return {t:t, w:w, answer:w.en, ch:choicesFrom(w.en, others.map(function(x){ return x.en; })), en:true};
  if(t==='spell') return {t:t, w:w, answer:w.en, spell:true};
  if(t==='synant'){
    var syn = splitList(w.syn), ant = splitList(w.ant);
    var askSyn = syn.length && (!ant.length || Math.random() < 0.5);
    var correct = askSyn ? syn[0] : ant[0];
    var trap = askSyn ? ant : syn;   /* 반대 관계 단어를 함정 선택지로 */
    var cands = trap.concat(shuffle(others).map(function(x){ return x.en; }));
    var ch = choicesFrom(correct, cands.filter(function(c){ return norm(c) !== norm(w.en) && (askSyn ? syn : ant).map(norm).indexOf(norm(c)) < 0; }));
    return {t:t, w:w, answer:correct, ch:ch, en:true, rel: askSyn ? '유의어' : '반의어'};
  }
  return null;
}
function buildQuiz(words, type, pool){
  var qs = [];
  words.forEach(function(w){
    var t = type;
    if(type==='mix') t = pick(['en2ko','ko2en','cloze','spell','synant'].filter(function(x){ return canType(w,x); }));
    var q = makeQ(w, t, pool); if(q) qs.push(q);
  });
  return qs;
}
function startQuiz(opt){
  var words = shuffle(opt.words.filter(function(w){ return opt.type==='mix' || canType(w, opt.type); }));
  if(!opt.retry) words = words.slice(0, S.settings.count);
  var qs = buildQuiz(words, opt.type, opt.pool);

  quiz: function(){

    if(q.t==='ko2en') body = '<span class="qlabel">뜻에 맞는 단어를 고르세요</span><div class="qko">'+esc(w.ko)+'</div>';

    }
    var ans = '';

      var cls = Q.answered ? (q.ok ? ' ok' : ' bad') : '';
      ans = '<form id="spellForm" class="stack" autocomplete="off"><input id="spellInp" class="inp word'+cls+'" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력" value="'+esc(q.given||'')+'"'+(Q.answered?' disabled':' data-focus')+'>'+(Q.answered?'':'<button class="btn primary wide" type="submit">확인</button>')+'</form>';
    } else {
      ans = '<div class="choices">'+q.ch.map(function(c,i){
        var cls = '';

        return '<button class="choice'+(q.en?' en':'')+cls+'" data-act="choose" data-i="'+i+'"'+(Q.answered?' disabled':'')+'><span class="n">'+MARK[i]+'</span><span class="c">'+esc(c)+'</span></button>';
      }).join('')+'</div>';
    }
    var fb = '';
    if(Q.answered){
      fb = q.ok ? '<div class="fb ok">정답이에요<small><span class="w">'+esc(w.en)+'</span> · '+esc(w.ko)+'</small></div>'
                : '<div class="fb bad">정답은 <span class="w">'+esc(q.answer)+'</span><small><span class="w">'+esc(w.en)+'</span> · '+esc(w.ko)+'</small></div>';
      fb += '<button class="btn primary wide" data-act="next" data-focus>'+(Q.i+1<total?'다음 문제':'결과 보기')+'</button>';
    }

  },
  result: function(){

      '<div class="row">'+(R.retry||R.cat==='오답노트' ? '<span class="pill blue">'+(R.cat==='오답노트'?'오답노트 복습':'재시험')+'</span>' : (pass?'<span class="pill good">통과</span>':'<span class="pill bad">통과 기준 '+S.settings.pass+'점 미달</span>'))+'<span class="sendstate">'+send+'</span></div></div>';

  tlogin: function(){
    return '<button class="back" data-act="toLogin">← 학생 로그인</button><div class="stack" style="gap:4px"><span class="eyebrow">선생님</span><h1 class="h1">결과 확인</h1><p class="sub">선생님 비밀번호를 입력하세요.</p></div>'+
    '<form id="tForm" class="stack" autocomplete="off"><div class="field"><label for="tpw">비밀번호</label><input id="tpw" class="inp" type="password" value="'+(LIVE?'':'1234')+'" data-focus required></div><p id="terr" class="err"></p><button class="btn primary wide" type="submit" id="tbtn">결과 보기</button></form>';
  },
  teacher: function(){
    var T = S.teacher, P = T.settings.pass;
    var units = T.sets.slice();
    T.results.forEach(function(r){ if(r.cat!=='오답노트' && !units.some(function(u){ return u.cat===r.cat && u.unit===r.unit; })) units.push({cat:r.cat, unit:r.unit, count:0}); });
    var sel = '<select id="tsel" class="sel" aria-label="단원"><option value="all">전체 단원</option>'+units.map(function(u){ var k=key(u.cat,u.unit); return '<option value="'+esc(k)+'"'+(S.tKey===k?' selected':'')+'>'+esc(u.cat)+' · '+esc(u.unit)+'</option>'; }).join('')+'</select>';
    var names = T.students.slice();
    T.results.forEach(function(r){ if(!names.some(function(s){ return s.name===r.name; })) names.push({name:r.name, cls:r.cls}); });
    var all = S.tKey === 'all';
    var rs = T.results.filter(function(r){ return all ? true : key(r.cat,r.unit)===S.tKey; });
    var main = rs.filter(function(r){ return !Core.isRetry(r) && r.cat!=='오답노트'; });
    var rows = names.map(function(s){
      var mine = main.filter(function(r){ return r.name===s.name; });
      var tries = rs.filter(function(r){ return r.name===s.name; }).length;
      if(all){
        var passedUnits = {}; mine.forEach(function(r){ if(r.pass) passedUnits[key(r.cat,r.unit)]=1; });
        var avg = mine.length ? Math.round(mine.reduce(function(a,r){ return a+r.score; },0)/mine.length) : null;
        var last = rs.filter(function(r){ return r.name===s.name; }).map(function(r){ return r.t; }).sort().pop();
        return {s:s, tries:tries, a:avg, b:Object.keys(passedUnits).length, last:last, any:tries>0};
      }
      var best = mine.length ? Math.max.apply(null, mine.map(function(r){ return r.score; })) : null;
      var lastScore = mine.length ? mine[mine.length-1].score : null;
      return {s:s, tries:tries, a:best, b:lastScore, passed:mine.some(function(r){ return r.pass; }), any:tries>0};
    });
    var taken = rows.filter(function(r){ return r.any; }).length;
    var scored = rows.filter(function(r){ return r.a != null; });
    var avgAll = scored.length ? Math.round(scored.reduce(function(a,r){ return a+r.a; },0)/scored.length) : '–';
    var third = all ? {k:'전체 응시', v:rs.length+'<small>회</small>'} : {k:'통과', v:rows.filter(function(r){ return r.passed; }).length+'<small>명</small>'};
    var html = '<div class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">선생님 · 결과 확인</span><h1 class="h1">우리 반 단어 테스트</h1></div><button class="btn" data-act="tRefresh">새로고침</button></div>'+sel+
      '<div class="stats"><div class="stat"><div class="k">응시 학생</div><div class="v">'+taken+'<small> / '+names.length+'명</small></div></div>'+
      '<div class="stat"><div class="k">'+(all?'평균 점수':'평균 최고점')+'</div><div class="v">'+avgAll+'<small>점</small></div></div>'+
      '<div class="stat"><div class="k">'+third.k+'</div><div class="v">'+third.v+'</div></div></div>';
    html += '<h2 class="h2">학생별 결과</h2><div class="tblwrap"><table><thead><tr><th>이름</th><th>반</th>'+
      (all ? '<th class="r">응시</th><th class="r">평균</th><th class="r">통과 단원</th><th>최근 응시</th>' : '<th class="r">응시</th><th class="r">최고점</th><th class="r">최근 점수</th><th>상태</th>')+'</tr></thead><tbody>'+
      rows.sort(function(a,b){ return (b.a==null?-1:b.a)-(a.a==null?-1:a.a); }).map(function(r){
        var state = !r.any ? '<span class="pill">미응시</span>' : (r.passed ? '<span class="pill good">통과</span>' : (r.a!=null && r.a<P ? '<span class="pill bad">재시험 필요</span>' : '<span class="pill warn">진행 중</span>'));
        return '<tr><td><b>'+esc(r.s.name)+'</b></td><td>'+esc(r.s.cls)+'</td>'+
          (all ? '<td class="r">'+r.tries+'</td><td class="r">'+(r.a==null?'–':r.a)+'</td><td class="r">'+r.b+'</td><td class="num">'+(r.last?esc(shortDate(r.last)):'–')+'</td>'
               : '<td class="r">'+r.tries+'</td><td class="r">'+(r.a==null?'–':r.a)+'</td><td class="r">'+(r.b==null?'–':r.b)+'</td><td>'+state+'</td>')+'</tr>';
      }).join('')+'</tbody></table></div>';
    var wc = {};
    rs.forEach(function(r){ (r.wrong||[]).forEach(function(en){ var k=en.toLowerCase(); wc[k]=wc[k]||{en:en,n:0}; wc[k].n++; }); });
    var top = Object.keys(wc).map(function(k){ return wc[k]; }).sort(function(a,b){ return b.n-a.n; }).slice(0,10);
    var max = top.length ? top[0].n : 1;
    html += '<h2 class="h2">많이 틀린 단어 TOP 10</h2><div class="list">'+(top.length ? top.map(function(x){ var w=findWord(x.en); return '<div class="topw"><div><span class="en">'+esc(x.en)+'</span> <span class="sub" style="display:inline">'+esc(w?w.ko:'')+'</span><div class="bar"><i style="width:'+Math.round(x.n/max*100)+'%"></i></div></div><span class="num r" style="text-align:right">'+x.n+'회</span><span></span></div>'; }).join('') : '<div class="empty">아직 틀린 단어 기록이 없어요.</div>')+'</div>';
    var recent = rs.slice().sort(function(a,b){ return a.t < b.t ? 1 : -1; }).slice(0,20);
    html += '<h2 class="h2">최근 응시 기록</h2><div class="tblwrap"><table><thead><tr><th>일시</th><th>이름</th><th>단원</th><th>유형</th><th class="r">점수</th></tr></thead><tbody>'+
      (recent.length ? recent.map(function(r){ return '<tr><td class="num">'+esc(shortDate(r.t))+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.cat==='오답노트'?'오답노트':r.cat+' '+r.unit)+'</td><td>'+esc(r.type)+'</td><td class="r"><b style="color:'+(r.score>=P?'var(--good)':'var(--bad)')+'">'+r.score+'</b></td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">아직 응시 기록이 없어요.</td></tr>')+
      '</tbody></table></div>';
    html += '<button class="btn wide" data-act="toLogin">나가기</button>';
    return html;
  }
};

/* ---------- 앱 설치 ---------- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; if(S.screen==='login' || S.screen==='home') render(); });
window.addEventListener('appinstalled', function(){ deferredPrompt = null; toast('앱을 설치했어요'); if(S.screen==='login' || S.screen==='home') render(); });
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function installHtml(){
  if(!CFG.pwa || standalone()) return '';
  if(deferredPrompt) return '<button class="btn wide" data-act="install">홈 화면에 앱 설치</button>';
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
  return '<p class="install">'+(ios ? '<b>Safari</b> 아래쪽 공유 버튼 → <b>홈 화면에 추가</b>를 누르면 앱으로 설치돼요.' : '브라우저 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르면 앱으로 설치돼요.')+'</p>';
}

/* ---------- 동작 ---------- */
function applyBoot(d, fromCache){ if(!fromCache && LIVE) store('boot', d); S.user=d.user; S.sets=d.sets||[]; S.settings=d.settings||S.settings; S.stats=d.stats||{}; S.note=d.note||[]; }
function finishQuiz(){
  var Q = S.quiz;
  var wrongQs = Q.qs.filter(function(q){ return !q.ok; });
  S.result = {cat:Q.cat, unit:Q.unit, type:Q.type, retry:Q.retry, typeName:(Q.retry?'재시험·':'')+TYPE_NAME[Q.type],
    correct:Q.correct, total:Q.qs.length, score:Math.round(Q.correct/Q.qs.length*100), wrongQs:wrongQs,
    rightEn:Q.qs.filter(function(q){ return q.ok; }).map(function(q){ return q.w.en; }), sec:Math.round((Date.now()-Q.start)/1000), sending:true, sent:false};
  go('result'); submit();
}
function submit(){
  var R = S.result; R.sending = true; R.sent = false; if(S.screen==='result') render();
  var payload = {cat:R.cat, unit:R.unit, type:R.typeName, correct:R.correct, total:R.total,
    wrong:R.wrongQs.map(function(q){ return q.w.en; }), right:R.rightEn, sec:R.sec};
  api('apiSubmit', S.user.name, S.pin, payload).then(function(d){
    R.sending=false; R.sent=true; S.stats=d.stats||S.stats; S.note=d.note||S.note; if(S.screen==='result') render();
  }).catch(function(e){ R.sending=false; R.sent=false; if(S.screen==='result') render(); toast(e.message); });
}
function answer(q, ok, given){
  var Q = S.quiz; q.ok = ok; q.given = given; Q.answered = true; if(ok) Q.correct++;
  render();
}
function loadTeacher(pw){
  return api('apiTeacher', pw).then(function(d){ S.teacher=d; S.tPw=pw; if(!S.user && d.words) S.sets = d.words; });
}

var ACT = {
  install: function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt = null; render(); }); },
  logout: function(){ store('login', null); store('boot', null); S.user=null; S.pin=''; go('login'); },
  toTeacher: function(){ go('tlogin'); },
  toLogin: function(){ S.teacher=null; go(S.user ? 'home' : 'login'); },
  home: function(){ go('home'); },
  cat: function(d){ S.cat = d.c; render(); },
  openUnit: function(d){ S.set = S.sets.filter(function(s){ return key(s.cat,s.unit)===d.k; })[0]; go('unit'); },
  unit: function(){ go('unit'); },
  study: function(){
    var lv = levels(), order = {1:0, 2:1, 0:2, 3:3};
    var q = S.set.words.map(function(w,i){ return {w:w, i:i, l:lv[w.en.toLowerCase()]||0}; })
      .sort(function(a,b){ return order[a.l]-order[b.l] || a.i-b.i; }).map(function(x){ return x.w; });
    var done = {};
    S.study = {queue:q, total:q.length, flipped:false, miss:0, unsure:0, done:done, left:function(){ var u={}; this.queue.forEach(function(w){ u[w.en]=1; }); return Object.keys(u).length; }};
    go('study');
  },
  flip: function(){ S.study.flipped = !S.study.flipped; render(); },
  speak: function(d){ speak(d.t); },
  rate: function(d){
    var st = S.study, w = st.queue.shift(), v = +d.v;
    setLevel(w.en, v);
    if(v===1){ st.miss++; st.queue.splice(Math.min(2, st.queue.length), 0, w); }
    if(v===2){ st.unsure++; st.queue.splice(Math.min(5, st.queue.length), 0, w); }
    st.flipped = false; render();
  },
  testSetup: function(){ go('testSetup'); },
  startTest: function(d){ startQuiz({words:S.set.words, type:d.t, pool:S.set.words, cat:S.set.cat, unit:S.set.unit}); },
  choose: function(d){ var q = S.quiz.qs[S.quiz.i]; if(S.quiz.answered) return; var c = q.ch[+d.i]; q.pickedIdx = +d.i; answer(q, c===q.answer, c); },
  next: function(){ var Q = S.quiz; if(Q.i+1 < Q.qs.length){ Q.i++; Q.answered=false; render(); window.scrollTo(0,0); } else finishQuiz(); },
  retry: function(){ var R = S.result; startQuiz({words:R.wrongQs.map(function(q){ return q.w; }), type:R.type, pool:R.cat==='오답노트'?allWords():S.set.words, cat:R.cat, unit:R.unit, retry:R.cat!=='오답노트'}); },
  resend: function(){ submit(); },
  openNote: function(){ go('note'); },
  noteTest: function(){
    var words = S.note.map(function(n){ return findWord(n.en); }).filter(Boolean);
    startQuiz({words:words, type:'mix', pool:allWords(), cat:'오답노트', unit:'-'});
  },
  tRefresh: function(){ loadTeacher(S.tPw).then(function(){ render(); toast('새로고침했어요'); }).catch(function(e){ toast(e.message); }); }
};

$app.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='flip' && e.target.closest('.speak')) return;
  var f = ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b.dataset, b); }
});
$who.addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if(b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset); });
$app.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('flash')){ e.preventDefault(); ACT.flip(); } });
$app.addEventListener('change', function(e){ if(e.target.id==='tsel'){ S.tKey = e.target.value; render(); } });
$app.addEventListener('submit', function(e){
  e.preventDefault();
  var id = e.target.id;
  if(id==='loginForm'){
    var name = document.getElementById('lname').value.trim(), pin = document.getElementById('lpin').value.trim();
    var btn = document.getElementById('lbtn'), err = document.getElementById('lerr');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; err.textContent='';
    api('apiBootstrap', name, pin).then(function(d){ applyBoot(d); S.pin = pin; store('login', {name:name, pin:pin}); go('home'); })
      .catch(function(x){
        var c = store('boot'), sv = store('login');
        if(x.offline && c && sv && sv.name===name && sv.pin===pin){ applyBoot(c, true); S.pin = pin; go('home'); toast('인터넷이 끊겨 저장된 단어로 열었어요'); return; }
        err.textContent = x.message; btn.disabled=false; btn.textContent='들어가기'; });
  }
  if(id==='tForm'){
    var pw = document.getElementById('tpw').value, tb = document.getElementById('tbtn'), te = document.getElementById('terr');
    tb.disabled = true; tb.innerHTML = '<span class="spin"></span>'; te.textContent='';
    loadTeacher(pw).then(function(){ S.tKey='all'; go('teacher'); }).catch(function(x){ te.textContent = x.message; tb.disabled=false; tb.textContent='결과 보기'; });
  }
  if(id==='spellForm'){
    var q = S.quiz.qs[S.quiz.i]; if(S.quiz.answered) return;
    var v = document.getElementById('spellInp').value;
    if(!v.trim()){ toast('단어를 입력하세요'); return; }
    answer(q, norm(v)===norm(q.answer), v.trim());
  }
});

/* 시작 */
if(!LIVE) document.getElementById('demo').hidden = false;
var saved = store('login');
if(saved && saved.name && saved.pin){
  api('apiBootstrap', saved.name, saved.pin).then(function(d){ applyBoot(d); S.pin = saved.pin; go('home'); }).catch(function(x){
    var c = store('boot');
    if(x.offline && c){ applyBoot(c, true); S.pin = saved.pin; go('home'); toast('인터넷이 끊겨 저장된 단어로 열었어요'); } else go('login');
  });
} else go('login');
})();
</script>
